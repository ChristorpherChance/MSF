# egress-proxy：沙箱出向唯一通道（REQ-803/ADR-8）。
# 白名单 = 已配置模型供应商端点；其余一律 403。M0 为配置样例，M6 随沙箱执行器启用。
server {
  listen 8081;
  resolver 127.0.0.11 valid=10s;  # Docker 内嵌 DNS

  # 白名单样例（按实际模型供应商配置；缺省全部拒绝）
  location ~ ^/proxy/(api\.anthropic\.com)/(.*)$ {
    proxy_pass https://$1/$2$is_args$args;
    proxy_ssl_server_name on;
  }

  location / {
    return 403;
  }
}
