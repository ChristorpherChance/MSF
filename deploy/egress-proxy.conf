# egress-proxy：沙箱出向唯一通道（REQ-803/ADR-8，LLD-7 N02-4）。
# 白名单 = 已配置模型供应商端点；其余一律 403。
# M7 实起（T7-14）：compose profile=full；新增供应商端点须先登记模型（设置页）再同步本清单。
server {
  listen 8081;
  resolver 127.0.0.11 valid=10s;  # Docker 内嵌 DNS

  # 白名单：模型供应商/网关端点（与 ai_models.base_url 对应；基线样例 + 当前网关）
  location ~ ^/proxy/(api\.anthropic\.com)/(.*)$ {
    proxy_pass https://$1/$2$is_args$args;
    proxy_ssl_server_name on;
  }
  location ~ ^/proxy/(gw\.superopen\.top)/(.*)$ {
    proxy_pass https://$1/$2$is_args$args;
    proxy_ssl_server_name on;
  }

  location / {
    return 403;  # 缺省全部拒绝（出向白名单负向，REQ-803）
  }
}
